<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>豆包 / Dola 助手 · 账号管理</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div>
          <p class="eyebrow">DoubaoKit</p>
          <h1>账号管理</h1>
        </div>
        <span id="siteTag" class="site-tag"></span>
      </header>

      <div id="accountManager" class="account-manager">
        <section class="current-account">
          <span class="current-label">当前使用</span>
          <div id="currentAccountBody" class="current-body"></div>
        </section>

        <section id="pendingPanel" class="pending hidden">
          <div>
            <strong>添加账号进行中</strong>
            <p>插件检测到登录态后会自动保存并关闭窗口。按钮仅作为兜底。</p>
          </div>
          <div class="row">
            <button id="finishLoginBtn" class="primary" type="button">完成并保存</button>
            <button id="cancelLoginBtn" type="button">取消恢复</button>
          </div>
        </section>

        <section class="actions">
          <button id="startLoginBtn" class="primary" type="button">添加账号</button>
          <button id="saveCurrentBtn" type="button">保存当前账号</button>
        </section>
        <p id="actionWarning" class="action-warning">
          添加账号会退出当前登录账号。若需要保留当前账号，请先点击“保存当前账号”。
        </p>

        <section class="accounts-section">
          <div class="section-title">
            <span>账号列表</span>
            <span id="countText">0 个</span>
          </div>
          <div id="accountList" class="account-list scroll-pane"></div>
        </section>

        <p id="statusText" class="status"></p>
      </div>
    </main>

    <div
      id="dialogLayer"
      class="dialog-layer hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="dialogTitle"
    >
      <div class="dialog-backdrop" data-role="backdrop"></div>
      <div class="dialog-card">
        <div class="dialog-icon" id="dialogIcon"></div>
        <h2 class="dialog-title" id="dialogTitle">提示</h2>
        <p class="dialog-text" id="dialogText"></p>
        <input
          class="dialog-input hidden"
          id="dialogInput"
          type="text"
          spellcheck="false"
          autocomplete="off"
        />
        <div class="dialog-actions" id="dialogActions">
          <button class="dialog-btn" id="dialogCancel" type="button">取消</button>
          <button class="dialog-btn primary" id="dialogConfirm" type="button">确定</button>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
